<!DOCTYPE html>
<html>
<head>
    <title>3 Tier Application</title>
</head>

<body>

<h1>My Automatic CI/CD Application</h1>

<form method="POST">
    <input
        type="text"
        name="name"
        placeholder="Enter Name"
        required
    >

    <button type="submit">
        Save
    </button>
</form>

<h2>Users</h2>

<ul>
{% for user in users %}
    <li>{{ user[1] }}</li>
{% endfor %}
</ul>

</body>
</html>
